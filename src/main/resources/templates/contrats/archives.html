<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Archives des contrats')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<div class="container">
    <div class="page-header">
        <h1>Archives des contrats</h1>
    </div>

    <div class="card">
        <form method="get" th:action="@{/contrats/archives}" class="search-bar">
            <div class="form-group">
                <label>Recherche</label>
                <input type="text" name="terme" th:value="${terme}" placeholder="Numéro, nom, CIN, société, adresse..."/>
            </div>
            <div class="form-group">
                <label>Statut</label>
                <select name="statut">
                    <option value="">Tous</option>
                    <option th:each="s : ${statuts}" th:value="${s}" th:text="${s.libelle}" th:selected="${s == statut}"></option>
                </select>
            </div>
            <div class="form-group">
                <label>Date début</label>
                <input type="date" name="dateDebut" th:value="${dateDebut}"/>
            </div>
            <div class="form-group">
                <label>Date fin</label>
                <input type="date" name="dateFin" th:value="${dateFin}"/>
            </div>
            <div class="form-group">
                <button type="submit" class="btn btn-primary">Rechercher</button>
            </div>
        </form>
    </div>

    <div class="card">
        <table th:if="${not #lists.isEmpty(contrats)}">
            <thead>
            <tr>
                <th>N°</th>
                <th>Propriétaire</th>
                <th>Locataire</th>
                <th>Création</th>
                <th>Début</th>
                <th>Fin</th>
                <th>Statut</th>
                <th class="text-right">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${contrats}">
                <td th:text="${c.numero}"></td>
                <td th:text="${#lists.isEmpty(c.parties) ? '' : (c.parties[0].nomAffichage)}"></td>
                <td th:text="${#lists.size(c.parties) < 2 ? '' : (c.parties[1].nomAffichage)}"></td>
                <td th:text="${#temporals.format(c.dateCreation, 'dd/MM/yyyy')}"></td>
                <td th:text="${c.dateDebut}"></td>
                <td th:text="${c.dateFin}"></td>
                <td>
                    <span th:each="st : ${c.statutsAffiches}" class="badge" th:classappend="'badge-' + ${st}"
                          th:text="${st.libelle}" style="margin-right:0.25rem;"></span>
                </td>
                <td class="text-right">
                    <a th:href="@{/contrats/{id}(id=${c.id})}" class="btn btn-sm">Voir</a>
                    <a th:href="@{/contrats/{id}/pdf(id=${c.id})}" target="_blank" class="btn btn-sm">PDF</a>
                    <a th:href="@{/contrats/{id}/pdf/telecharger(id=${c.id})}" class="btn btn-sm">Télécharger</a>
                    <button type="button" class="btn btn-sm btn-accent renouveler-btn" th:if="${c.expire}"
                            th:data-id="${c.id}" th:data-numero="${c.numero}"
                            th:data-date-fin="${c.dateFin != null ? #temporals.format(c.dateFin, 'yyyy-MM-dd') : ''}">
                        🔁 Renouveler
                    </button>
                </td>
            </tr>
            </tbody>
        </table>
        <p class="muted" th:if="${#lists.isEmpty(contrats)}">Aucun contrat ne correspond à cette recherche.</p>
    </div>
</div>

<div th:replace="~{fragments/layout :: modalRenouvellement}"></div>
<script th:inline="javascript">
    const API_CONTRATS = /*[[@{/api/contrats}]]*/ '/api/contrats';
    const URL_CONTRAT = /*[[@{/contrats/}]]*/ '/contrats/';
</script>
<script th:src="@{/js/renouvellement.js}"></script>
</body>
</html>
