spring.application.name=contrats-bail

# ==== Base de donnees PostgreSQL ====
spring.datasource.url=jdbc:postgresql://localhost:5432/contrats_bail
spring.datasource.username=postgres
spring.datasource.password=hatif
spring.datasource.driver-class-name=org.postgresql.Driver

# ==== JPA / Hibernate ====
# Le schema est gere par Flyway : Hibernate ne doit jamais modifier les tables.
spring.jpa.hibernate.ddl-auto=validate
# Active a true : les vues Thymeleaf accedent a des associations lazy
# (parties, articles, signatures, representants...) apres le retour du
# controleur. Sans cela (false), Hibernate leve LazyInitializationException
# des que le template essaie de lire une collection non chargee.
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# ==== Flyway ====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ==== Upload / stockage des documents ====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.documents.storage-path=./data/contrats

# ==== Thymeleaf ====
spring.thymeleaf.cache=false

server.port=8080
